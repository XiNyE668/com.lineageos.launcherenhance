plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lineageos.launcherenhance'
    compileSdk 36

    defaultConfig {
        applicationId 'com.lineageos.launcherenhance'
        minSdk 30
        targetSdk 36
        versionCode 24
        versionName '2.0-A16-test5'
    }

    signingConfigs {
        ciTest {
            storeFile rootProject.file('.github/test-signing/launcherhub-test.jks')
            storePassword 'launcherhub'
            keyAlias 'launcherhub-test'
            keyPassword 'launcherhub'
        }
    }

    buildTypes {
        debug {
            if (rootProject.file('.github/test-signing/launcherhub-test.jks').exists()) {
                signingConfig signingConfigs.ciTest
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
