plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lineageos.launcherenhance'
    compileSdk 36

    defaultConfig {
        applicationId 'com.lineageos.launcherenhance'
        minSdk 30
        targetSdk 36
        versionCode 27
        versionName '2.0-A16-test8'
    }

    signingConfigs {
        ciTest {
            storeFile rootProject.file('.github/test-signing/launcherhub-test.jks')
            storePassword 'launcherhub'
            keyAlias 'launcherhub-test'
            keyPassword 'launcherhub'
            // minSdk 30 lets AGP omit legacy JAR/v1 signing by default. Some third-party
            // file managers still inspect or stream APKs through v1-centric code paths.
            // Force all embedded schemes for broad Package Installer compatibility.
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            if (rootProject.file('.github/test-signing/launcherhub-test.jks').exists()) {
                signingConfig signingConfigs.ciTest
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
