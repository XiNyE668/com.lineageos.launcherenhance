plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lineageos.launcherenhance'
    compileSdk 36

    defaultConfig {
        applicationId 'com.lineageos.launcherenhance'
        minSdk 30
        targetSdk 36
        versionCode 27
        versionName '2.0-A16-test8'
    }

    signingConfigs {
        ciTest {
            storeFile rootProject.file('.github/test-signing/launcherhub-test.jks')
            storePassword 'launcherhub'
            keyAlias 'launcherhub-test'
            keyPassword 'launcherhub'
        }
    }

    buildTypes {
        debug {
            // CI signs the aligned APK explicitly with apksigner. AGP 8.7 + minSdk 30
            // otherwise optimizes the debug package down to v3-only signing, which is valid on
            // Android 16 but less compatible with third-party file-manager APK parsers.
            signingConfig null
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
