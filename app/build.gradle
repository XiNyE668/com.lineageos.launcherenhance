plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lineageos.launcherenhance'
    compileSdk 36

    defaultConfig {
        applicationId 'com.lineageos.launcherenhance'
        minSdk 30
        targetSdk 36
        versionCode 100
        versionName '1.0'
    }

    signingConfigs {
        ciTest {
            storeFile rootProject.file('.github/test-signing/launcherhub-test.jks')
            storePassword 'launcherhub'
            keyAlias 'launcherhub-test'
            keyPassword 'launcherhub'
        }
    }

    buildTypes {
        debug {
            if (rootProject.file('.github/test-signing/launcherhub-test.jks').exists()) {
                signingConfig signingConfigs.ciTest
            }
        }
        release {
            // The Xposed entry points are loaded by class name from assets/xposed_init.
            // Keep release bytecode unshrunk to eliminate R8 stripping/renaming risk.
            minifyEnabled false
            shrinkResources false
            if (rootProject.file('.github/test-signing/launcherhub-test.jks').exists()) {
                signingConfig signingConfigs.ciTest
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
