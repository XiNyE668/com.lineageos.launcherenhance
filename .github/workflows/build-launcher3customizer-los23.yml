name: Build Launcher3Customizer LOS23.2 Safe Full

on:
  workflow_dispatch:
  push:
    branches:
      - launcher3customizer-los23-build
    paths:
      - 'los23-build/**'
      - '.github/workflows/build-launcher3customizer-los23.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: launcher3customizer-los23-build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve Android build tools
        shell: bash
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          test -n "$SDK"
          if ! ls "$SDK"/build-tools/*/d8 >/dev/null 2>&1; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
          fi
          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BT/d8"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          echo "BT=$BT" >> "$GITHUB_ENV"

      - name: Compile LOS23.2 compatibility code with javac + D8
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build
          mkdir -p build/stubs build/classes build/dex
          javac -source 8 -target 8 -d build/stubs $(find los23-build/stubs -name '*.java' | sort)
          jar cf build/xposed-stubs.jar -C build/stubs .
          javac -source 8 -target 8 -cp build/xposed-stubs.jar -d build/classes $(find los23-build/src -name '*.java' | sort)
          jar cf build/compat.jar -C build/classes .
          "$BT/d8" --min-api 30 --classpath build/xposed-stubs.jar --output build/dex build/compat.jar
          test -s build/dex/classes.dex
          python3 - <<'PY'
          import hashlib, struct, zlib
          d=open('build/dex/classes.dex','rb').read()
          assert d.startswith(b'dex\n')
          assert hashlib.sha1(d[32:]).digest()==d[12:32]
          assert (zlib.adler32(d[12:])&0xffffffff)==struct.unpack_from('<I',d,8)[0]
          assert b'Los23CompatHook' in d and b'RootRestart' in d
          print('compat dex bytes:', len(d))
          PY

      - name: Download original APK and Apktool
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://github.com/Xposed-Modules-Repo/com.hhvvg.launcher3customizer/releases/download/5-1.0.1/Launcher3Customizer-1.0.1-release.apk' \
            -o build/original.apk
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar' \
            -o build/apktool.jar
          test -s build/original.apk
          test -s build/apktool.jar
          unzip -t build/original.apk >/dev/null

      - name: Decode original without rebuilding resources
        shell: bash
        run: |
          set -euxo pipefail
          java -jar build/apktool.jar d --no-res -f build/original.apk -o build/decoded
          test -f 'build/decoded/smali/com/hhvvg/launcher/Launcher$LauncherCallback.smali'
          test -f 'build/decoded/smali/com/hhvvg/launcher/ILauncherService$Stub$Proxy.smali'
          test -f build/decoded/assets/xposed_init

      - name: Apply LOS23.2 smali compatibility patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 los23-build/tools/apktool_patch.py build/decoded
          grep -q 'LauncherModel;->forceReload()V' 'build/decoded/smali/com/hhvvg/launcher/Launcher$LauncherCallback.smali'
          test "$(grep -R -c 'RootRestart;->schedule()V' 'build/decoded/smali/com/hhvvg/launcher/ILauncherService$Stub$Proxy.smali')" -ge 18
          ! grep -q 'Process;->sendSignal' 'build/decoded/smali/com/hhvvg/launcher/Launcher$LauncherCallback.smali'
          cat build/decoded/assets/xposed_init

      - name: Rebuild original smali with Apktool
        shell: bash
        run: |
          set -euxo pipefail
          java -jar build/apktool.jar b build/decoded -o build/rebuilt-base.apk
          unzip -t build/rebuilt-base.apk >/dev/null

      - name: Add D8-compiled LOS23 dex
        shell: bash
        run: |
          set -euxo pipefail
          cp build/rebuilt-base.apk build/unsigned-unaligned.apk
          cp build/dex/classes.dex build/classes3.dex
          zip -q -0 -j build/unsigned-unaligned.apk build/classes3.dex
          unzip -t build/unsigned-unaligned.apk >/dev/null

      - name: Zipalign and sign with Android apksigner
        shell: bash
        run: |
          set -euxo pipefail
          "$BT/zipalign" -p -f 4 build/unsigned-unaligned.apk build/aligned.apk
          "$BT/zipalign" -c -p 4 build/aligned.apk
          keytool -genkeypair -noprompt \
            -keystore build/los23-safe-test.jks -storepass launcher3customizer -keypass launcher3customizer \
            -alias los23safe -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Launcher3Customizer LOS23 Safe Test,O=Open Source Test,C=US'
          "$BT/apksigner" sign \
            --ks build/los23-safe-test.jks --ks-pass pass:launcher3customizer \
            --ks-key-alias los23safe --key-pass pass:launcher3customizer \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out build/Launcher3Customizer-LOS23.2-Safe-Full-Test.apk build/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs build/Launcher3Customizer-LOS23.2-Safe-Full-Test.apk | tee build/apksigner-verify.txt
          sha256sum build/Launcher3Customizer-LOS23.2-Safe-Full-Test.apk | tee build/Launcher3Customizer-LOS23.2-Safe-Full-Test-SHA256.txt

      - name: Static safety and install-package checks
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import zipfile, hashlib, struct, zlib
          p='build/Launcher3Customizer-LOS23.2-Safe-Full-Test.apk'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              for n in ('classes.dex','classes2.dex','classes3.dex','resources.arsc','assets/xposed_init'):
                  assert n in names, n
              assert z.read('assets/xposed_init').decode().strip().splitlines()==[
                  'com.hhvvg.launcher.Init',
                  'com.hhvvg.launcher.compat.Los23CompatHook']
              for n in ('classes.dex','classes2.dex','classes3.dex','resources.arsc'):
                  assert z.getinfo(n).compress_type==zipfile.ZIP_STORED, (n,z.getinfo(n).compress_type)
              for n in ('classes.dex','classes2.dex','classes3.dex'):
                  d=z.read(n)
                  assert d.startswith(b'dex\n'), n
                  assert hashlib.sha1(d[32:]).digest()==d[12:32], n+' sha1'
                  assert (zlib.adler32(d[12:])&0xffffffff)==struct.unpack_from('<I',d,8)[0], n+' adler'
              c3=z.read('classes3.dex')
              assert b'Los23CompatHook' in c3 and b'RootRestart' in c3
              print('APK payload OK; entries:',len(z.infolist()))
          PY
          if test -x "$BT/aapt"; then
            "$BT/aapt" dump badging build/Launcher3Customizer-LOS23.2-Safe-Full-Test.apk | head -20 | tee build/aapt-badging.txt
          else
            echo 'aapt unavailable' | tee build/aapt-badging.txt
          fi

      - name: Write build notes
        shell: bash
        run: |
          cat > build/Launcher3Customizer-LOS23.2-Safe-Full-Test-NOTES.txt <<'EOF'
          Launcher3Customizer LOS23.2 Safe Full Test

          Safety change from the rejected Full-Test build:
          - There is NO Trebuchet-side Process.kill/sendSignal restart callback.
          - Initial Launcher callback synchronization cannot kill Trebuchet.
          - Android-13 LauncherModel#mApp icon-pack refresh is replaced by LauncherModel.forceReload().
          - The six obsolete DeviceProfile/IDP callbacks are no-ops on LOS23.2.
          - Actual user visual-setting changes call RootRestart.schedule() from the Launcher3Customizer APP-side Binder proxy only.
          - RootRestart verifies ActivityThread.currentPackageName()==com.hhvvg.launcher3customizer, debounces 800 ms, then executes: su -c "killall com.android.launcher3".
          - Denied/missing root is swallowed and cannot crash either Launcher3Customizer or Trebuchet.

          Added LOS23.2 hook:
          - BubbleTextView icon/text/padding/label adaptation.
          - Memory / ZRAM display in Overview.
          - Clear all inserted immediately left of Screenshot and delegates to Trebuchet's native mClearAllButton.

          Required LSPosed scope remains only:
          - System Framework
          - Trebuchet (com.android.launcher3)
          No self-scope is required because RootRestart is invoked directly by app smali, not Xposed.
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Launcher3Customizer-LOS23.2-Safe-Full-Test
          path: |
            build/Launcher3Customizer-LOS23.2-Safe-Full-Test.apk
            build/Launcher3Customizer-LOS23.2-Safe-Full-Test-SHA256.txt
            build/Launcher3Customizer-LOS23.2-Safe-Full-Test-NOTES.txt
            build/apksigner-verify.txt
            build/aapt-badging.txt
          if-no-files-found: error
          retention-days: 30
