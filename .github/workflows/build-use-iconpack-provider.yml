name: Build Launcher Hub 1.0 Release

on:
  workflow_dispatch:
  push:
    branches:
      - launcherhub-1.0-release
    paths:
      - 'app/**'
      - '.github/workflows/build-use-iconpack-provider.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare stable signing key
        run: |
          set -euxo pipefail
          base64 -d .github/test-signing/launcherhub-test.jks.b64 > .github/test-signing/launcherhub-test.jks
          keytool -list -keystore .github/test-signing/launcherhub-test.jks \
            -storepass launcherhub -alias launcherhub-test >/dev/null

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify Launcher Hub 1.0
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          OUT=Launcher-Hub-1.0-A16-LineageOS23.2-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null

          # Xposed entry points must survive the release build unchanged.
          for entry in \
            com.lineageos.launcherenhance.IconPackProviderHook \
            com.lineageos.launcherenhance.LauncherEnhanceHook \
            com.lineageos.launcherenhance.RecentsMemoryHook \
            com.lineageos.launcherenhance.RecentsActionsHook \
            com.lineageos.launcherenhance.LauncherIntegrationHook; do
            unzip -p "$APK" assets/xposed_init | grep -Fxq "$entry"
          done

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          "$AAPT" dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.lineageos.launcherenhance' versionCode='100' versionName='1.0'" badging.txt

          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee manifest-tree.txt
          grep -q 'xposedscope' manifest-tree.txt
          grep -q 'com.android.launcher3' manifest-tree.txt

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner.txt

          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee SHA256.txt

          rm -f /tmp/all.dex
          for name in classes.dex classes2.dex classes3.dex classes4.dex; do
            unzip -p "$APK" "$name" >> /tmp/all.dex 2>/dev/null || true
          done

          # Provider-layer icon-pack architecture.
          strings /tmp/all.dex | grep -q 'IconPackProviderHook'
          strings /tmp/all.dex | grep -q 'com.android.launcher3.icons.LauncherIconProviderImpl'
          strings /tmp/all.dex | grep -q 'loadPackageIcon'
          strings /tmp/all.dex | grep -q 'getStateForApp'
          strings /tmp/all.dex | grep -q 'clearMemoryCache'
          strings /tmp/all.dex | grep -q 'reloadIfActive'
          strings /tmp/all.dex | grep -q 'suppressed Trebuchet restart for icon-pack-only change'

          # Original use.apk late paint path is present only as fail-soft fallback;
          # the provider hook suppresses it when the provider layer is active.
          strings /tmp/all.dex | grep -q 'applyIconPack'

          # Known unsafe / Android-13-only paths must not be introduced.
          ! strings /tmp/all.dex | grep -q 'killall com.android.launcher3'
          ! strings /tmp/all.dex | grep -q 'sendSignal'
          ! strings /tmp/all.dex | grep -q 'LauncherModel;->getApp'
          ! strings /tmp/all.dex | grep -q 'forceReload'

          cat > NOTES.txt <<'EOF'
          Launcher Hub 1.0 - Android 16 / LineageOS 23.2

          Baseline
          - Built from use.apk's stable Launcher Hub architecture.
          - Existing desktop, drawer, Recents Memory/ZRAM, Clear All/Screenshot and customization behavior are preserved.

          Launcher3Customizer 1.0.1 icon-pack mechanism
          - Original System Framework scope is the control plane: LauncherService/AIDL stores and distributes iconPackProvider and notifies callbacks.
          - Original Trebuchet scope is the rendering/cache plane: LauncherIconProvider + CustomIconCache/IconHelper resolve the icon-pack drawable before BubbleTextView binding.
          - Original provider change clears its icon cache and refreshes LauncherModel through LauncherModel#getApp()->LauncherAppState.refreshAndReloadLauncher().
          - That getApp/mApp path is incompatible with Android 16 / LineageOS 23.2 and is not ported.

          Launcher Hub 1.0 port
          - use.apk's existing ConfigProvider + ContentObserver replaces the original System Framework LauncherService/AIDL control plane.
          - Therefore no new system_server service or System Framework LSPosed hook is required.
          - Trebuchet icon replacement is performed in LauncherIconProviderImpl.loadPackageIcon before IconCache creates BitmapInfo.
          - Workspace, All Apps and folder previews therefore consume the same cached icon source.
          - LineageOS dynamic Calendar/Clock handling remains untouched.
          - Supports appfilter resource XML, assets/appfilter.xml and drawable.xml fallback.
          - Missing mappings preserve the stock LineageOS icon.

          Cache and live switching
          - The selected pack is added to IconProvider.getStateForApp freshness state so persistent icon rows become stale when the pack changes.
          - Icon-pack-only change: invalidate parser -> IconCache.clearMemoryCache -> LauncherModel.reloadIfActive.
          - The generic use.apk Trebuchet restart is suppressed for icon-pack-only changes.
          - Other Launcher Hub changes preserve use.apk's existing reload behavior.
          - No startup forceReload, SIGKILL, root shell, LauncherModel#getApp/mApp, or obsolete DeviceProfile access is added.

          LSPosed
          - Recommended scope: Trebuchet / com.android.launcher3 only.
          - System Framework is deliberately not required in this adapted architecture.

          Release
          - package: com.lineageos.launcherenhance
          - versionName: 1.0
          - versionCode: 100
          - release build is intentionally not R8-minified so all xposed_init class names remain stable.
          EOF

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-Hub-1.0-A16-LineageOS23.2-release
          path: |
            Launcher-Hub-1.0-A16-LineageOS23.2-release.apk
            SHA256.txt
            apksigner.txt
            badging.txt
            manifest-tree.txt
            NOTES.txt
          if-no-files-found: error
          retention-days: 30
