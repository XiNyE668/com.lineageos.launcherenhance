name: Build use icon-pack provider port

on:
  workflow_dispatch:
  push:
    branches:
      - use-iconpack-provider-port
    paths:
      - 'app/**'
      - '.github/workflows/build-use-iconpack-provider.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare deterministic test signing key
        run: |
          set -euxo pipefail
          base64 -d .github/test-signing/launcherhub-test.jks.b64 > .github/test-signing/launcherhub-test.jks
          keytool -list -keystore .github/test-signing/launcherhub-test.jks \
            -storepass launcherhub -alias launcherhub-test >/dev/null

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify native provider port
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          OUT=Launcher-Hub-use-IconPackProvider-LOS23.2-Test2.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/xposed_init | grep -Fxq 'com.lineageos.launcherenhance.IconPackProviderHook'
          unzip -p "$APK" assets/xposed_init | grep -Fxq 'com.lineageos.launcherenhance.LauncherEnhanceHook'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" \
            | tee apksigner.txt
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee SHA256.txt

          rm -f /tmp/all.dex
          for name in classes.dex classes2.dex classes3.dex classes4.dex; do
            unzip -p "$APK" "$name" >> /tmp/all.dex 2>/dev/null || true
          done
          strings /tmp/all.dex | grep -q 'IconPackProviderHook'
          strings /tmp/all.dex | grep -q 'com.android.launcher3.icons.LauncherIconProviderImpl'
          strings /tmp/all.dex | grep -q 'loadPackageIcon'
          strings /tmp/all.dex | grep -q 'getStateForApp'
          strings /tmp/all.dex | grep -q 'clearMemoryCache'
          strings /tmp/all.dex | grep -q 'reloadIfActive'
          strings /tmp/all.dex | grep -q 'suppressed Trebuchet restart for icon-pack-only change'
          strings /tmp/all.dex | grep -q 'applyIconPack'
          ! strings /tmp/all.dex | grep -q 'killall com.android.launcher3'
          ! strings /tmp/all.dex | grep -q 'sendSignal'
          ! strings /tmp/all.dex | grep -q 'forceReload'

          cat > NOTES.txt <<'EOF'
          Launcher Hub / use.apk - Launcher3Customizer provider-layer icon-pack port Test2

          Baseline:
          - Keeps use.apk as the functional baseline.
          - Existing desktop, drawer, Recents, Launcher Hub settings and integration are preserved.

          Original Launcher3Customizer 1.0.1 mechanism:
          - System Framework scope: LauncherService/AIDL distributes the selected icon-pack provider.
          - Trebuchet scope: Launcher icon-provider/cache classes perform icon substitution before BubbleTextView binding.
          - The old LOS-incompatible reload path referenced LauncherModel#getApp / mApp.

          LOS23.2 port:
          - use.apk already has ConfigProvider + ContentObserver, so it replaces the old system_server LauncherService control plane. No duplicate System Framework service is installed.
          - Normal icon substitution occurs in LauncherIconProviderImpl.loadPackageIcon before IconCache creates BitmapInfo.
          - Native dynamic Calendar/Clock handling remains before this insertion point and is not replaced.
          - appfilter resource, appfilter.xml asset and drawable.xml fallback are supported.
          - Missing icon-pack mapping falls through to the stock LineageOS icon.
          - When provider-layer hooking succeeds, use.apk's previous BubbleTextView late applyIconPack helper is suppressed; if provider hooking fails, that old path remains as a fail-soft fallback.

          Cache / live switching:
          - IconProvider.getStateForApp includes the selected pack, invalidating persistent stale rows naturally.
          - Pack change -> IconPackLoader.invalidate -> IconCache.clearMemoryCache -> LauncherModel.reloadIfActive.
          - No startup forceReload and no LauncherModel#getApp/mApp access in the provider hook.
          - A restart guard suppresses use.apk's generic Trebuchet self-restart when ICON_PACK is the only setting that changed. Other Launcher Hub settings retain use.apk's existing reload behavior.
          - If Restore Defaults changes multiple settings at once, the generic use.apk reload is allowed.

          LSPosed scope for this port:
          - Trebuchet / com.android.launcher3 only.
          - System Framework is not required because use.apk's ConfigProvider replaces Launcher3Customizer's Framework-side IPC role.
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-Hub-use-IconPackProvider-LOS23.2-Test2
          path: |
            Launcher-Hub-use-IconPackProvider-LOS23.2-Test2.apk
            SHA256.txt
            apksigner.txt
            NOTES.txt
          if-no-files-found: error
          retention-days: 30
