name: Build use icon-pack provider port

on:
  workflow_dispatch:
  push:
    branches:
      - use-iconpack-provider-port
    paths:
      - 'app/**'
      - '.github/workflows/build-use-iconpack-provider.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare deterministic test signing key
        run: |
          set -euxo pipefail
          base64 -d .github/test-signing/launcherhub-test.jks.b64 > .github/test-signing/launcherhub-test.jks
          keytool -list -keystore .github/test-signing/launcherhub-test.jks \
            -storepass launcherhub -alias launcherhub-test >/dev/null

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify provider-layer port
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          OUT=Launcher-Hub-use-IconPackProvider-LOS23.2-Test.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/xposed_init | grep -Fxq 'com.lineageos.launcherenhance.IconPackProviderHook'
          unzip -p "$APK" assets/xposed_init | grep -Fxq 'com.lineageos.launcherenhance.LauncherEnhanceHook'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" \
            | tee apksigner.txt
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee SHA256.txt

          rm -f /tmp/all.dex /tmp/classes*.dex
          for name in classes.dex classes2.dex classes3.dex classes4.dex; do
            unzip -p "$APK" "$name" >> /tmp/all.dex 2>/dev/null || true
          done
          strings /tmp/all.dex | grep -q 'IconPackProviderHook'
          strings /tmp/all.dex | grep -q 'com.android.launcher3.icons.LauncherIconProviderImpl'
          strings /tmp/all.dex | grep -q 'loadPackageIcon'
          strings /tmp/all.dex | grep -q 'getStateForApp'
          strings /tmp/all.dex | grep -q 'clearMemoryCache'
          strings /tmp/all.dex | grep -q 'reloadIfActive'
          ! strings /tmp/all.dex | grep -q 'killall com.android.launcher3'
          ! strings /tmp/all.dex | grep -q 'sendSignal'
          ! strings /tmp/all.dex | grep -q 'Process.killProcess'

          cat > NOTES.txt <<'EOF'
          Launcher Hub / use.apk - Launcher3Customizer provider-layer icon-pack port

          Baseline:
          - Keeps the Android16/LineageOS23.2 use.apk rewrite as the functional baseline.
          - Existing Recents/desktop/customization behavior is preserved.

          What was learned from Launcher3Customizer 1.0.1:
          - Its selected icon-pack setting is distributed through LauncherService/AIDL from the System Framework scope.
          - Trebuchet performs the actual icon replacement through Launcher icon-provider/cache classes (LauncherIconProvider, CustomIconCache, IconHelper), before icons are bound to BubbleTextView.
          - Therefore the two original scopes have different jobs: System Framework is the settings/control plane; Trebuchet is the rendering/cache plane.

          Port used here:
          - use.apk already has ConfigProvider + ContentObserver as a safe settings/control plane, so the old system_server LauncherService is deliberately NOT recreated.
          - Actual replacement is moved from use.apk's old BubbleTextView late-draw path into LOS23.2 LauncherIconProviderImpl.loadPackageIcon(PackageItemInfo, ApplicationInfo, int).
          - This is before IconCache creates BitmapInfo, so workspace, All Apps and folder previews consume one cached icon source.
          - LOS23.2's native dynamic Calendar/Clock path remains untouched because IconProvider resolves those before calling loadPackageIcon.
          - appfilter XML resource, appfilter.xml asset and drawable.xml fallback are supported.
          - Missing mapping leaves the stock LineageOS icon unchanged.

          Cache/reload:
          - Selected icon-pack package is appended to IconProvider.getStateForApp freshness id, naturally invalidating persistent stale icon rows.
          - On explicit pack change: invalidate pack parser -> IconCache.clearMemoryCache -> LauncherModel.reloadIfActive.
          - This mirrors LOS23.2 LauncherIconProviderImpl's own IconProcessorPlugin refresh pattern.
          - No Trebuchet restart, SIGKILL, root shell, startup forceReload, LauncherModel#mApp, or obsolete DeviceProfile APIs.

          LSPosed scope:
          - Trebuchet / com.android.launcher3 only.
          - System Framework is not required by this port because use.apk's existing ConfigProvider replaces Launcher3Customizer's system_server IPC service.
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-Hub-use-IconPackProvider-LOS23.2-Test
          path: |
            Launcher-Hub-use-IconPackProvider-LOS23.2-Test.apk
            SHA256.txt
            apksigner.txt
            NOTES.txt
          if-no-files-found: error
          retention-days: 30
