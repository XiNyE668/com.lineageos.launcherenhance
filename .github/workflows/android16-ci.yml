name: Android 16 CI

on:
  workflow_dispatch:
  push:
    branches:
      - android16-lineage23.2-rewrite
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare deterministic test signing key
        run: |
          base64 -d .github/test-signing/launcherhub-test.jks.b64 > .github/test-signing/launcherhub-test.jks
          keytool -list -keystore .github/test-signing/launcherhub-test.jks \
            -storepass launcherhub -alias launcherhub-test >/dev/null
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify installable APK and Xposed payload
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          OUT=Launcher-Hub-2.0-A16-LineageOS23.2-test6-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'assets/xposed_init'
          unzip -p "$APK" assets/xposed_init | grep -q 'RecentsMemoryHook'
          unzip -p "$APK" assets/xposed_init | grep -q 'RecentsActionsHook'
          unzip -p "$APK" assets/xposed_init | grep -q 'LauncherIntegrationHook'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" \
            | grep -qi '467aab6a668e4fd8db8f8247ab06fdbb81c108735714b53b330670c6f4fafc89'
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-Hub-2.0-A16-LineageOS23.2-test6
          path: |
            Launcher-Hub-2.0-A16-LineageOS23.2-test6-debug.apk
            Launcher-Hub-2.0-A16-LineageOS23.2-test6-debug.apk.sha256
