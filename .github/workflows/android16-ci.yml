name: Android 16 CI

on:
  workflow_dispatch:
  push:
    branches:
      - android16-lineage23.2-rewrite
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare deterministic test signing key
        run: |
          base64 -d .github/test-signing/launcherhub-test.jks.b64 > .github/test-signing/launcherhub-test.jks
          keytool -list -keystore .github/test-signing/launcherhub-test.jks \
            -storepass launcherhub -alias launcherhub-test >/dev/null
      - name: Build unsigned debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Align and compatibility-sign APK
        run: |
          UNSIGNED=app/build/outputs/apk/debug/app-debug-unsigned.apk
          ALIGNED="$RUNNER_TEMP/launcherhub-aligned.apk"
          OUT=Launcher-Hub-2.0-A16-LineageOS23.2-test8-debug.apk
          test -f "$UNSIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"

          # Force APK Signature Scheme v2 instead of the AGP 8.7/minSdk30 default v3-only package.
          # v2 is accepted by modern Android while remaining friendlier to older third-party APK
          # parsers/file-manager hand-off paths. The signing certificate is unchanged.
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks .github/test-signing/launcherhub-test.jks \
            --ks-key-alias launcherhub-test \
            --ks-pass pass:launcherhub \
            --key-pass pass:launcherhub \
            --min-sdk-version 24 \
            --max-sdk-version 27 \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --out "$OUT" "$ALIGNED"
      - name: Verify installable APK and Xposed payload
        run: |
          APK=Launcher-Hub-2.0-A16-LineageOS23.2-test8-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'assets/xposed_init'
          unzip -p "$APK" assets/xposed_init | grep -q 'LauncherBootstrapHook'
          unzip -p "$APK" assets/xposed_init | grep -q 'LauncherEnhanceHook'
          unzip -p "$APK" assets/xposed_init | grep -q 'RecentsMemoryHook'
          unzip -p "$APK" assets/xposed_init | grep -q 'RecentsActionsHook'
          VERIFY="$RUNNER_TEMP/apksigner-verify.txt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$VERIFY"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$VERIFY"
          grep -qi '467aab6a668e4fd8db8f8247ab06fdbb81c108735714b53b330670c6f4fafc89' "$VERIFY"
          sha256sum "$APK" > "$APK.sha256"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-Hub-2.0-A16-LineageOS23.2-test8
          path: |
            Launcher-Hub-2.0-A16-LineageOS23.2-test8-debug.apk
            Launcher-Hub-2.0-A16-LineageOS23.2-test8-debug.apk.sha256
