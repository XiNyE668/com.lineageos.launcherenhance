name: Android 16 CI

on:
  workflow_dispatch:
  push:
    branches:
      - android16-lineage23.2-rewrite
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify Xposed payload
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'assets/xposed_init'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" Launcher-Enhance-2.0-A16-LineageOS23.2-test1-debug.apk
          sha256sum Launcher-Enhance-2.0-A16-LineageOS23.2-test1-debug.apk > Launcher-Enhance-2.0-A16-LineageOS23.2-test1-debug.apk.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-Enhance-2.0-A16-LineageOS23.2-test1
          path: |
            Launcher-Enhance-2.0-A16-LineageOS23.2-test1-debug.apk
            Launcher-Enhance-2.0-A16-LineageOS23.2-test1-debug.apk.sha256
