name: Build Launcher Hub use 1.0

on:
  workflow_dispatch:
  push:
    branches:
      - use-wallpaper-3finger-los23

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Add only the two requested settings to use.apk baseline UI
        run: |
          python3 tools/patch_use_plus_ui.py
          grep -q 'addSwitch("壁纸随桌面滚动", ConfigKeys.ALLOW_WALLPAPER_SCROLLING, false);' app/src/main/java/com/lineageos/launcherenhance/MainActivity.java
          grep -q 'addSection("系统手势");' app/src/main/java/com/lineageos/launcherenhance/MainActivity.java
          grep -q 'addSwitch("三指下滑截图", ConfigKeys.THREE_FINGER_SCREENSHOT, true);' app/src/main/java/com/lineageos/launcherenhance/MainActivity.java
          grep -q 'showIconPackDialog' app/src/main/java/com/lineageos/launcherenhance/MainActivity.java
          grep -q 'IconPackLoader' app/src/main/java/com/lineageos/launcherenhance/LauncherEnhanceHook.java

      - name: Prepare deterministic compatibility signing key
        run: |
          base64 -d .github/test-signing/launcherhub-test.jks.b64 > .github/test-signing/launcherhub-test.jks
          keytool -list -keystore .github/test-signing/launcherhub-test.jks \
            -storepass launcherhub -alias launcherhub-test >/dev/null

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify v1.0 APK and unchanged baseline payload
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          OUT=Launcher-Hub-use-1.0.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null

          INIT="$(unzip -p "$APK" assets/xposed_init)"
          echo "$INIT" | grep -q 'LauncherEnhanceHook'
          echo "$INIT" | grep -q 'RecentsMemoryHook'
          echo "$INIT" | grep -q 'RecentsActionsHook'
          echo "$INIT" | grep -q 'LauncherIntegrationHook'
          echo "$INIT" | grep -q 'WallpaperScrollHook'
          echo "$INIT" | grep -q 'ThreeFingerScreenshotHook'

          rm -f /tmp/classes*.dex /tmp/all.dex
          unzip -p "$APK" classes.dex > /tmp/classes.dex || true
          unzip -p "$APK" classes2.dex > /tmp/classes2.dex || true
          unzip -p "$APK" classes3.dex > /tmp/classes3.dex || true
          cat /tmp/classes*.dex > /tmp/all.dex

          # Existing use.apk features that must remain.
          grep -a -q 'IconPackLoader' /tmp/all.dex
          grep -a -q 'icon_pack' /tmp/all.dex
          grep -a -q 'RecentsMemoryHook' /tmp/all.dex
          grep -a -q 'RecentsActionsHook' /tmp/all.dex
          grep -a -q 'LauncherIntegrationHook' /tmp/all.dex

          # Only two new capabilities.
          grep -a -q 'WallpaperOffsetInterpolator' /tmp/all.dex
          grep -a -q 'wallpaperOffsetForScroll' /tmp/all.dex
          grep -a -q 'allow_wallpaper_scrolling' /tmp/all.dex
          grep -a -q 'PhoneWindowManager' /tmp/all.dex
          grep -a -q 'registerPointerEventListener' /tmp/all.dex
          grep -a -q 'three_finger_screenshot' /tmp/all.dex

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" \
            | tee apksigner.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee badging.txt
          grep -q "versionName='1.0'" badging.txt
          grep -q "versionCode='41'" badging.txt

          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          cat > NOTES.txt <<'EOF'
          Launcher Hub use 1.0 / Android 16 / LineageOS 23.2

          Baseline:
          - use.apk behavior retained, including icon-pack UI/mechanism and existing Launcher/Recents features.
          - No removal or replacement of existing icon-pack functionality.

          Added feature 1:
          - 壁纸随桌面滚动
          - Default: OFF
          - OFF only pins WallpaperOffsetInterpolator wallpaper offset; Workspace scrolling remains stock.
          - ON leaves LineageOS wallpaper-scroll behavior stock.

          Added feature 2:
          - 系统手势 -> 三指下滑截图
          - Default: ON
          - Global three-finger downward gesture is detected in System Framework and requests a normal full screenshot.

          LSPosed scopes:
          - System Framework
          - Trebuchet (com.android.launcher3)

          No other feature changes are intended in this 1.0 build.
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-Hub-use-1.0
          path: |
            Launcher-Hub-use-1.0.apk
            Launcher-Hub-use-1.0.apk.sha256
            NOTES.txt
            apksigner.txt
            badging.txt
          if-no-files-found: error
          retention-days: 90
