name: Build Launcher Hub use-plus

on:
  workflow_dispatch:
  push:
    branches:
      - use-wallpaper-3finger-los23

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Patch use.apk-compatible settings UI
        run: |
          python3 tools/patch_use_plus_ui.py
          grep -q '壁纸随桌面滚动' app/src/main/java/com/lineageos/launcherenhance/MainActivity.java
          grep -q '三指下滑截图' app/src/main/java/com/lineageos/launcherenhance/MainActivity.java

      - name: Prepare deterministic compatibility signing key
        run: |
          base64 -d .github/test-signing/launcherhub-test.jks.b64 > .github/test-signing/launcherhub-test.jks
          keytool -list -keystore .github/test-signing/launcherhub-test.jks \
            -storepass launcherhub -alias launcherhub-test >/dev/null

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify installable APK and feature payload
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          OUT=Launcher-Hub-use-plus-Wallpaper-3Finger-A16.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/xposed_init'
          INIT="$(unzip -p "$APK" assets/xposed_init)"
          echo "$INIT" | grep -q 'LauncherEnhanceHook'
          echo "$INIT" | grep -q 'RecentsMemoryHook'
          echo "$INIT" | grep -q 'RecentsActionsHook'
          echo "$INIT" | grep -q 'LauncherIntegrationHook'
          echo "$INIT" | grep -q 'WallpaperScrollHook'
          echo "$INIT" | grep -q 'ThreeFingerScreenshotHook'

          unzip -p "$APK" classes.dex > /tmp/classes.dex || true
          unzip -p "$APK" classes2.dex > /tmp/classes2.dex || true
          unzip -p "$APK" classes3.dex > /tmp/classes3.dex || true
          cat /tmp/classes*.dex > /tmp/all.dex
          grep -a -q 'WallpaperOffsetInterpolator' /tmp/all.dex
          grep -a -q 'wallpaperOffsetForScroll' /tmp/all.dex
          grep -a -q 'PhoneWindowManager' /tmp/all.dex
          grep -a -q 'registerPointerEventListener' /tmp/all.dex
          grep -a -q 'three_finger_screenshot' /tmp/all.dex
          grep -a -q 'allow_wallpaper_scrolling' /tmp/all.dex

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" \
            | tee apksigner.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" \
            | grep -qi '467aab6a668e4fd8db8f8247ab06fdbb81c108735714b53b330670c6f4fafc89'

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee badging.txt
          grep -q "versionName='2.1-A16-use-plus1'" badging.txt

          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          cat > NOTES.txt <<'EOF'
          Launcher Hub use-plus / Android 16 / LineageOS 23.2

          Baseline:
          - Kept the old four-entry Launcher Hub architecture used by use.apk.
          - No LauncherBootstrapHook and no later settings-integration rewrite imported.

          New feature 1 - Wallpaper scrolling:
          - UI switch: 壁纸随桌面滚动 (default OFF).
          - OFF short-circuits only WallpaperOffsetInterpolator.wallpaperOffsetForScroll().
          - Uses crDroid semantics: LTR offset 0, RTL offset 1, denominator 1.
          - Workspace page scrolling and all other Launcher animations remain stock.
          - ON leaves the LineageOS 23.2 method completely untouched.

          New feature 2 - Three-finger swipe down screenshot:
          - UI switch: 三指下滑截图 (default ON).
          - Global PointerEventListener is registered from PhoneWindowManager in system_server.
          - Gesture geometry mirrors crDroid ThreeFingersSwipeListener: 3 pointers within 500 ms,
            <=150dp vertical start spread, not in bottom 50dp, average downward travel >=50dp.
          - Screenshot is requested through LineageOS PhoneWindowManager.takeScreenshot().
          - No SystemUI hook and no all-app hook.

          Recommended LSPosed scopes:
          - System Framework
          - Trebuchet (com.android.launcher3)

          Safety:
          - All new hook registration paths fail-soft.
          - No APatch files, no system partition modification.
          - Existing use.apk Launcher Hub behavior is otherwise unchanged.
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-Hub-use-plus-Wallpaper-3Finger-A16
          path: |
            Launcher-Hub-use-plus-Wallpaper-3Finger-A16.apk
            Launcher-Hub-use-plus-Wallpaper-3Finger-A16.apk.sha256
            NOTES.txt
            apksigner.txt
            badging.txt
          if-no-files-found: error
          retention-days: 90
