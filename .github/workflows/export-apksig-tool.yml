name: Export apksig tool

on:
  workflow_dispatch:
  push:
    branches:
      - launcherhub-1.0-release
    paths:
      - '.github/workflows/export-apksig-tool.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download official Android apksig library
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            https://dl.google.com/dl/android/maven2/com/android/tools/build/apksig/8.9.0/apksig-8.9.0.jar \
            -o apksig-8.9.0.jar
          test -s apksig-8.9.0.jar
          sha256sum apksig-8.9.0.jar > apksig-SHA256.txt
      - name: Upload apksig
        uses: actions/upload-artifact@v4
        with:
          name: apksig-8.9.0
          path: |
            apksig-8.9.0.jar
            apksig-SHA256.txt
          retention-days: 1
