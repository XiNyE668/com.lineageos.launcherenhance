name: Build Back Arrow Brightness LOS23.2

on:
  workflow_dispatch:
  push:
    branches:
      - back-arrow-brightness-los23
    paths:
      - 'back-display-module/**'
      - '.github/workflows/build-back-display-tweaks.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: back-arrow-brightness-los23

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          test -n "$SDK"
          if [ ! -f "$SDK/platforms/android-36/android.jar" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          fi
          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BT/aapt2"
          test -x "$BT/d8"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"
          echo "ANDROID_JAR=$SDK/platforms/android-36/android.jar" >> "$GITHUB_ENV"
          echo "BT=$BT" >> "$GITHUB_ENV"

      - name: Compile Xposed API stubs
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build
          mkdir -p build/stubs build/classes build/dex
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d build/stubs \
            $(find back-display-module/stubs -name '*.java' | sort)
          jar cf build/xposed-stubs.jar -C build/stubs .

      - name: Compile module
        shell: bash
        run: |
          set -euxo pipefail
          javac -source 8 -target 8 \
            -cp "$ANDROID_JAR:build/xposed-stubs.jar" \
            -d build/classes \
            $(find back-display-module/src -name '*.java' | sort)
          jar cf build/module.jar -C build/classes .
          "$BT/d8" --min-api 30 --lib "$ANDROID_JAR" \
            --classpath build/xposed-stubs.jar \
            --output build/dex build/module.jar
          test -s build/dex/classes.dex
          python3 - <<'PY'
          import hashlib,struct,zlib
          d=open('build/dex/classes.dex','rb').read()
          assert d.startswith(b'dex\n')
          assert hashlib.sha1(d[32:]).digest()==d[12:32]
          assert (zlib.adler32(d[12:])&0xffffffff)==struct.unpack_from('<I',d,8)[0]
          assert b'com/xinye/backdisplay/ModuleHook' in d
          assert b'de/robv/android/xposed/XposedBridge' in d
          print('DEX OK', len(d))
          PY

      - name: Package APK
        shell: bash
        run: |
          set -euxo pipefail
          "$BT/aapt2" link \
            -I "$ANDROID_JAR" \
            --manifest back-display-module/AndroidManifest.xml \
            -A back-display-module/assets \
            --min-sdk-version 30 \
            --target-sdk-version 36 \
            --version-code 5 \
            --version-name '1.1' \
            -o build/base.apk
          (cd build/dex && zip -q -0 ../base.apk classes.dex)
          unzip -t build/base.apk >/dev/null

      - name: Zipalign and sign
        shell: bash
        run: |
          set -euxo pipefail
          "$BT/zipalign" -p -f 4 build/base.apk build/aligned.apk
          "$BT/zipalign" -c -p 4 build/aligned.apk
          base64 -d back-display-module/signing/backdisplay-test.p12.b64 > build/backdisplay-test.p12
          "$BT/apksigner" sign \
            --ks build/backdisplay-test.p12 \
            --ks-type PKCS12 \
            --ks-pass pass:backdisplay \
            --ks-key-alias backdisplay \
            --key-pass pass:backdisplay \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out build/Back-Arrow-Brightness-LOS23.2-v1.1-Release.apk \
            build/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs \
            build/Back-Arrow-Brightness-LOS23.2-v1.1-Release.apk | tee build/apksigner.txt
          sha256sum build/Back-Arrow-Brightness-LOS23.2-v1.1-Release.apk | tee build/SHA256.txt

      - name: Release verification
        shell: bash
        run: |
          set -euxo pipefail
          APK=build/Back-Arrow-Brightness-LOS23.2-v1.1-Release.apk
          python3 - <<'PY'
          import zipfile
          p='build/Back-Arrow-Brightness-LOS23.2-v1.1-Release.apk'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert z.read('assets/xposed_init').decode().strip() == 'com.xinye.backdisplay.ModuleHook'
              dex=z.read('classes.dex')
              assert dex.startswith(b'dex\n')
              for marker in [
                  b'AutomaticBrightnessController',
                  b'BackPanelController',
                  b'updateArrowState',
                  b'currentState',
                  b'ENTRY',
                  b'show_back_arrow',
                  b'brightness_floor_enabled',
                  b'com.xinye.backdisplay.settings']:
                  assert marker in dex, marker
              for marker in [
                  b'DefaultCrossActivityBackAnimation',
                  b'CrossTaskBackAnimation',
                  b'LauncherBackAnimationController',
                  b'killall', b'killProcess', b'sendSignal', b'/data/adb/modules']:
                  assert marker not in dex, marker
              print('APK/Dex safety checks OK')
          PY
          grep -q 'android:name="xposedscope"' back-display-module/AndroidManifest.xml
          grep -q 'android:value="android;com.android.systemui"' back-display-module/AndroidManifest.xml
          "$BT/aapt2" dump badging "$APK" | tee build/badging.txt
          grep -q "versionCode='5'" build/badging.txt
          grep -q "versionName='1.1'" build/badging.txt
          cat > build/NOTES.txt <<'EOF'
          Back Arrow & Brightness - LOS23.2 v1.1 Release

          Change from v1.0:
          - Fixed LSPosed Recommended scope declaration.
          - Recommended now resolves to System Framework + System UI.
          - Core Back Arrow and brightness logic is unchanged from v1.0/Test2.

          Recommended LSPosed scopes:
          - System Framework (LSPosed synthetic package: system)
          - System UI (package com.android.systemui)
          - Trebuchet is NOT required

          LSPosed legacy scope declaration:
          - AndroidManifest meta-data: xposedscope="android;com.android.systemui"
          - For legacy modules LSPosed maps declared "android" to its synthetic "system" scope,
            which is displayed as System Framework.

          Back Arrow:
          - crDroid-equivalent visibility semantics at BackPanelController GestureState.ENTRY.
          - Default: Show Back gesture arrow = OFF.
          - OFF: only ENTRY visibility is overridden to GONE.
          - ON: stock LineageOS BackPanel visibility is used.

          Display:
          - Automatic-brightness minimum floor ON by default.
          - Default floor 10%; adjustable 1-30%.
          - Applied only with auto brightness enabled and display STATE_ON.
          - Doze/AOD excluded.
          - Wake refresh re-arms ALS once on non-ON -> ON and requests updates at 250 ms and 900 ms.

          Safety:
          - No process kill/restart behavior.
          - No APatch/system-file modification.
          - No Trebuchet hook.
          - Hooks are fail-soft.
          EOF

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Back-Arrow-Brightness-LOS23.2-v1.1-Release
          path: |
            build/Back-Arrow-Brightness-LOS23.2-v1.1-Release.apk
            build/SHA256.txt
            build/apksigner.txt
            build/badging.txt
            build/NOTES.txt
          if-no-files-found: error
          retention-days: 30
